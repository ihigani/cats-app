services:
  postgres:
    image: postgres:16-alpine
    container_name: cats-postgres
    environment:
      POSTGRES_USER: cats_user
      POSTGRES_PASSWORD: cats_password
      POSTGRES_DB: cats_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cats_user -d cats_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
